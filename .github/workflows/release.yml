name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)publish, e.g. v0.2.0 (must already exist)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "package.json version: $version / tag: $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: node scripts/test-integration.mjs --skip-api

      - name: Package VSIX
        run: npm run package

      - name: Checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum "opencode-pane-$VERSION.vsix" > "opencode-pane-$VERSION.vsix.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: opencode-pane ${{ steps.version.outputs.version }}
          files: |
            opencode-pane-${{ steps.version.outputs.version }}.vsix
            opencode-pane-${{ steps.version.outputs.version }}.vsix.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
